name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -e
          for file in preview.html index.html 404.html .nojekyll README.md LICENSE \
            assets/brand/banner.png assets/brand/social-preview.png \
            assets/media/xray-tour.gif \
            html/index.html html/dashboard-1.html html/dashboard-2.html \
            html/dashboard-3.html html/dashboard-4.html \
            react/package.json vue/package.json; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Check HTML page count
        run: |
          set -e
          count=$(find html -maxdepth 1 -name '*.html' | wc -l)
          echo "Top-level HTML pages: $count"
          test "$count" -eq 72

      - name: Parse HTML files
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Checker(HTMLParser):
              pass

          files = sorted(Path("html").glob("*.html"))
          files += [Path("html/app/index.html"), Path("html/app/index-email.html"), Path("html/app/email-compose.html")]
          files += [Path("preview.html"), Path("index.html"), Path("404.html")]

          for path in files:
              parser = Checker()
              parser.feed(path.read_text(encoding="utf-8", errors="replace"))
              parser.close()

          print(f"Parsed {len(files)} HTML files")
          PY

      - name: Check preview anchors
        run: |
          set -e
          for id in gameBegin quizOptions featureSearch paletteInput roiDevs; do
            grep -q "id=\"$id\"" preview.html || { echo "Missing preview element: $id"; exit 1; }
          done

      - name: Validate package manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('react/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vue/package.json','utf8'))"
          echo "Package manifests are valid JSON"
