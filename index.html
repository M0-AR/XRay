<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRay — Opening the preview…</title>
<meta http-equiv="refresh" content="0;url=preview.html">
<link rel="canonical" href="https://m0-ar.github.io/XRay/preview.html">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05090f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307141d'/%3E%3Cpath d='M18 16l28 32M46 16L18 48' stroke='%232ee6d6' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%235b8cff'/%3E%3C/svg%3E">
<script>
(function () {
  try { location.replace('preview.html' + (location.hash || '')); } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #05090f;
    --text: #e9f5fb;
    --muted: #93adbc;
    --cyan: #2ee6d6;
    --blue: #5b8cff;
    --line: rgba(152, 199, 221, .14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(700px 420px at 72% -10%, rgba(46, 230, 214, .14), transparent 62%),
      radial-gradient(640px 420px at 10% 20%, rgba(91, 140, 255, .12), transparent 60%),
      linear-gradient(180deg, #05090f, #07121b 60%, #05090f);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { text-align: center; padding: 32px 20px; }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'Sora', 'Inter', system-ui, sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .brand svg { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 14px 40px rgba(46, 230, 214, .18); }
  .bar {
    width: 190px;
    height: 3px;
    margin: 26px auto 16px;
    border-radius: 999px;
    background: rgba(152, 199, 221, .16);
    overflow: hidden;
  }
  .bar span {
    display: block;
    width: 45%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(330%); }
  }
  .status { margin: 0; color: var(--muted); font-size: .95rem; }
  .fallback { margin: 10px 0 0; color: #6d8797; font-size: .82rem; }
  .fallback a { color: var(--cyan); text-decoration: none; border-bottom: 1px solid rgba(46, 230, 214, .35); }
  .fallback a:hover { border-bottom-color: var(--cyan); }
  @media (prefers-reduced-motion: reduce) {
    .bar span { animation: none; width: 100%; }
  }
</style>
</head>
<body>
<main class="wrap" role="main">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#07141d"/>
      <path d="M18 16l28 32M46 16L18 48" stroke="#2ee6d6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="6" fill="#5b8cff"/>
    </svg>
    <span>XRay</span>
  </div>
  <div class="bar" aria-hidden="true"><span></span></div>
  <p class="status" role="status" aria-live="polite">Opening the interactive preview…</p>
  <p class="fallback">If nothing happens, <a href="preview.html">open the preview</a>.</p>
</main>
</body>
</html>
